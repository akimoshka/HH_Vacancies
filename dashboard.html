<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jobs Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f9ff;
      color: #222;
    }

    header {
      background: #0b59ea;
      color: white;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 20px;
      padding: 2rem;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
      padding: 1rem;
      overflow: hidden;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .card h3 {
      margin: 0 0 1rem 0;
      font-size: 1.2rem;
      color: #0b59ea;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 8px;
    }

    .full-width iframe {
      height: 600px;
    }

    img {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<header>Python Job Market Dashboard from HH.ru</header>

<div class="dashboard">

  <div class="card">
    <h3>Employment Type Distribution</h3>
    <iframe src="charts/employment_pie.html"></iframe>
  </div>

  <div class="card">
    <h3>Salary vs Experience</h3>
    <iframe src="charts/salary_boxplot.html"></iframe>
  </div>

  <div class="card">
    <h3>Salary based on Experience and Employment type</h3>
    <iframe src="charts/salary_3d.html"></iframe>
  </div>

  <div class="card">
    <h3>Top Python Job Titles</h3>
    <img src="charts/top_titles.png" alt="Top Python Job Titles">
  </div>

  <div class="card full-width">
    <h3>Job Title Breakdown</h3>
    <iframe src="charts/job_treemap.html"></iframe>
  </div>

</div>

</body>
</html>
